  <text x="92" y="110" font-size="26" font-family="Noto Sans KR, Malgun Gothic, sans-serif" fill="#e2e8f0" font-weight="700">C안 캘린더 자동동기화 구현계획</text>
  <text x="92" y="152" font-size="42" font-family="Noto Sans KR, Malgun Gothic, sans-serif" fill="#f8fafc" font-weight="900">설정 1회 + 이후 무조작 동기화</text>
  <text x="92" y="190" font-size="22" font-family="Noto Sans KR, Malgun Gothic, sans-serif" fill="#bae6fd">웹 MVP에서 시작해 모바일 브리지로 확장하는 4주 로드맵</text>

  <rect x="56" y="254" width="840" height="550" rx="18" fill="#ffffff" stroke="#dbe3ef"/>
